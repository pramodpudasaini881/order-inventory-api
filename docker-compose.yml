services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Always point the containerized app at the "mongo" service name,
      # regardless of what MONGO_URI is set to for local (non-docker) dev.
      MONGO_URI: mongodb://mongo:27017/order-inventory
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
